<style>
/* ============================================================
   DeckForge UI 令牌 —— 由 tokens.json 与生成器模板导出（勿手改）
   生成来源：W3C DTCG tokens.json；版本：v2
   用法：任何前端直接 <link rel="stylesheet" href="app.css"> 即可拿到令牌与组件类
   ============================================================ */

:root {
  /* —— 颜色—— */
  --color-primary: #2068F0;
  --color-secondary: #5A6B87;
  --color-tertiary: #28A0F8;
  --color-neutral: #F1F6FD;
  --color-surface: #ffffff;
  --color-surface-alt: #eff4fd;
  --color-surface-tag: #EAF3FF;
  --color-border: #E3EBF9;
  --color-divider: #EBF2FE;
  --color-ink: #101828;
  --color-ink-sub: #5A6B87;
  --color-ink-muted: #64748F;
  --color-accent-tint-ink: #1D5FD8;
  --color-accent: #3B8DF7;
  --color-accent-strong: #2068F0;
  --color-success-bg: #e8ffea;
  --color-success-ink: #00831f;
  --color-warn-bg: #fff7e8;
  --color-warn-ink: #b05600;
  --color-danger-bg: #ffece8;
  --color-danger-ink: #c63333;
  --color-badge-from: #c64676;
  --color-badge-to: #be54de;
  --color-surface-band: #F7FAFF;
  --color-border-strong: #D6E4F7;
  --color-brand-grad-from: #2E6BF2;
  --color-brand-grad-to: #3E92F8;

  /* —— 间距 / 圆角 —— */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 16px;
  --spacing-lg: 24px;
  --spacing-xl: 32px;
  --spacing-page-margin: 24px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;

  /* —— 字体与字号 —— */
  --font-sans: "PingFang SC", "Source Han Sans SC", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --text-h1: 1.75rem;
  --text-h1--weight: 600;
  --text-h1--font: "PingFang SC";
  --text-h2: 1.25rem;
  --text-h2--weight: 600;
  --text-h2--font: "PingFang SC";
  --text-h3: 1rem;
  --text-h3--weight: 600;
  --text-h3--font: "PingFang SC";
  --text-body-md: 0.875rem;
  --text-body-md--weight: 400;
  --text-body-md--font: "PingFang SC";
  --text-body-sm: 0.8125rem;
  --text-body-sm--weight: 400;
  --text-body-sm--font: "PingFang SC";
  --text-caption: 0.75rem;
  --text-caption--weight: 400;
  --text-caption--font: "PingFang SC";

  /* —— 卡片 / 悬停 / 浮层阴影 —— */
  --shadow-card: 0 1px 2px rgba(16,40,90,.04), 0 8px 24px rgba(16,40,90,.05);
  --shadow-hover: 0 4px 10px rgba(16,40,90,.07), 0 18px 44px rgba(16,40,90,.10);
  --shadow-overlay: 0 1px 2px rgba(30,35,46,.04), 0 8px 24px rgba(30,35,46,.06);
  --color-ledger-divider: #EEF4FE;
  --dur-fast: 140ms;
}

/* —— 暗色（v2）：令牌级覆盖，组件无需改动 —— */
[data-theme="dark"] {
  --color-surface-band: #1E2330;
  --color-border-strong: #333A4B;
  --color-brand-grad-from: #3C74C9;
  --color-brand-grad-to: #3C74C9;
  --color-secondary: #A3AAB8;
  --color-neutral: #12151C;
  --color-surface: #1A1E27;
  --color-surface-alt: #222634;
  --color-surface-tag: #23304A;
  --color-border: #2C3241;
  --color-divider: #2C3241;
  --color-ink: #E8EBF2;
  --color-ink-sub: #A3AAB8;
  --color-ink-muted: #8A93A3;
  --color-primary: #3C74C9;
  --color-accent-strong: #3C74C9;
  --color-accent: #4C93FF;
  --color-accent-tint-ink: #9CC4FF;
  --color-success-bg: #0F2A18;
  --color-success-ink: #4ADE80;
  --color-warn-bg: #2E2210;
  --color-warn-ink: #FBBF24;
  --color-danger-bg: #331A1A;
  --color-danger-ink: #F87171;
  --color-ledger-divider: #2C3241;
  --shadow-card: 0 1px 2px rgba(0,0,0,.40), 0 8px 24px rgba(0,0,0,.35);
  --shadow-hover: 0 6px 14px rgba(0,0,0,.45), 0 18px 44px rgba(0,0,0,.50);
  --shadow-overlay: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.5);
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--color-neutral); color: var(--color-ink);
  font-family: var(--font-sans); font-size: var(--text-body-md); line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

/* ============ 组件类（与 DESIGN.md 的 25 个组件一一对应） ============ */
/* 数字继承正文字体，仅启用表格数字 */
.num, td.num, .metric-value { font-feature-settings: "tnum"; }

/* 卡片 */
.card {
  background: var(--color-surface); color: var(--color-ink);
  border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  padding: var(--spacing-lg);
  box-shadow: var(--shadow-card);
}
.card-title { font-size: var(--text-h2); font-weight: var(--text-h2--weight); margin: 0 0 var(--spacing-sm); }
.card-desc { color: var(--color-secondary); margin: 0 0 var(--spacing-md); }

/* 按钮 */
.btn {
  display: inline-flex; align-items: center; gap: var(--spacing-xs);
  height: 40px; padding: 0 var(--spacing-md); border-radius: var(--radius-md);
  font-family: inherit; font-size: var(--text-body-md); cursor: pointer;
  border: 1px solid transparent; transition: background var(--dur-fast), border-color var(--dur-fast), transform var(--dur-fast);
}
.btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.btn:active { transform: scale(.99); }
.btn-primary { background: linear-gradient(92deg, var(--color-brand-grad-from), var(--color-brand-grad-to)); color: #fff; box-shadow: 0 6px 16px rgba(32,104,240,.28); }
.btn-primary:hover { filter: brightness(.96); }
.btn-secondary { background: var(--color-surface); color: var(--color-ink); border-color: var(--color-border-strong); }
.btn-secondary:hover { background: var(--color-surface-alt); }
.btn-ghost { background: transparent; color: var(--color-accent-strong); }
.btn-ghost:hover { background: var(--color-surface-tag); }
.btn[disabled], .btn.is-disabled { opacity: .5; cursor: not-allowed; }

/* 标签 / 角标 */
.tag {
  display: inline-block; padding: 2px var(--spacing-sm); border-radius: var(--radius-sm);
  background: var(--color-surface-tag); color: var(--color-accent-tint-ink); font-size: var(--text-body-sm);
}
.badge {
  display: inline-block; padding: 2px var(--spacing-sm); border-radius: var(--radius-sm); color: #fff;
  background: linear-gradient(90deg, var(--color-badge-from), var(--color-badge-to)); font-size: var(--text-caption);
}

/* 输入 */
.input {
  height: 40px; width: 100%; padding: 0 var(--spacing-md); border-radius: var(--radius-md);
  border: 1px solid var(--color-border-strong); background: var(--color-surface); color: var(--color-ink);
  font-family: inherit; font-size: var(--text-body-md);
}
.input::placeholder { color: var(--color-ink-muted); }
.input:focus { outline: none; border-color: var(--color-accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-accent) 18%, transparent); }
.input.is-error { border-color: var(--color-danger-ink); }

/* 区块 / 链接 / 指标 */
.panel-alt { background: var(--color-surface-alt); border-radius: var(--radius-md); padding: var(--spacing-md); }
.link { color: var(--color-accent-strong); text-decoration: none; cursor: pointer; }
.link:hover { text-decoration: underline; }
.metric { display: flex; flex-direction: column; gap: 2px; }
.metric-label { color: var(--color-ink-sub); font-size: var(--text-caption); }
.metric-value { font-size: 1.25rem; font-weight: 600; }

/* 进度条 */
.progress { height: 8px; border-radius: 999px; background: var(--color-surface-alt); overflow: hidden; }
.progress > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(92deg, var(--color-accent), var(--color-tertiary)); }
.progress.is-decor > i { background: linear-gradient(92deg, var(--color-accent), var(--color-tertiary)); }

/* 步骤条 */
.steps { display: flex; gap: var(--spacing-sm); flex-wrap: wrap; align-items: center; }
.step {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px var(--spacing-sm);
  border-radius: 999px; font-size: var(--text-body-sm);
}
.step.done { background: var(--color-surface-tag); color: var(--color-accent-tint-ink); }
.step.active { background: linear-gradient(92deg, var(--color-brand-grad-from), var(--color-brand-grad-to)); color: #fff; }
.step.pending { background: var(--color-surface-alt); color: var(--color-ink-sub); }
.step.error { background: var(--color-danger-bg); color: var(--color-danger-ink); }
.step-sep { color: var(--color-border); }

/* 状态胶囊 */
.status { display: inline-block; padding: 2px var(--spacing-sm); border-radius: 999px; font-size: var(--text-caption); }
.status-success { background: var(--color-success-bg); color: var(--color-success-ink); }
.status-warn { background: var(--color-warn-bg); color: var(--color-warn-ink); }
.status-danger { background: var(--color-danger-bg); color: var(--color-danger-ink); }
.status-info { background: var(--color-surface-tag); color: var(--color-accent-tint-ink); }

/* 缩略图网格（业务组件） */
.thumb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: var(--spacing-md); }
.thumb {
  position: relative; aspect-ratio: 16/9; border-radius: var(--radius-md); border: 1px solid var(--color-border);
  background: var(--color-surface-alt); display: flex; align-items: center; justify-content: center;
  color: var(--color-ink-muted); font-size: var(--text-caption); cursor: pointer; overflow: hidden;
}
.thumb.selected { border: 2px solid var(--color-accent); background: color-mix(in srgb, var(--color-accent) 10%, var(--color-surface)); }
.thumb .corner { position: absolute; top: 6px; left: 6px; }
.thumb .pageno { position: absolute; bottom: 6px; right: 8px; color: var(--color-ink-sub); }

/* 表格（账本） */
table.ledger { width: 100%; border-collapse: separate; border-spacing: 0; border: 1px solid var(--color-border); box-shadow: var(--shadow-card); background: var(--color-surface); border-radius: var(--radius-lg); overflow: hidden; }
table.ledger th { background: var(--color-surface-alt); color: var(--color-ink-sub); font-weight: 500; text-align: left; padding: var(--spacing-sm) var(--spacing-md); font-size: var(--text-body-sm); }
table.ledger td { padding: var(--spacing-sm) var(--spacing-md); border-top: 1px solid var(--color-ledger-divider); }

.divider { height: 1px; background: var(--color-divider); border: 0; }

/* 空态 / 错误态 / Toast */
.empty { text-align: center; padding: var(--spacing-xl); color: var(--color-ink-sub); }
.error-box { background: var(--color-danger-bg); color: var(--color-danger-ink); border-radius: var(--radius-md); padding: var(--spacing-md); }
.toast {
  display: inline-flex; align-items: center; gap: var(--spacing-sm); background: var(--color-surface);
  border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--spacing-sm) var(--spacing-md);
  box-shadow: var(--shadow-overlay);
}
/* v2：分组色带与两类胶囊 */
.band { background: var(--color-surface-band); border: 1px solid var(--color-divider); border-radius: var(--radius-xl); padding: 24px; }
.card-interactive, .thumb { box-shadow: var(--shadow-card); transition: transform var(--dur-fast), box-shadow var(--dur-fast); }
.card-interactive:hover, .thumb:not(.cursor-not-allowed):hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.tabs { display: inline-flex; flex-wrap: wrap; gap: 6px; padding: 4px; border-radius: 999px; background: var(--color-surface-alt); border: 1px solid var(--color-border); }
.tabs > button { border-radius: 999px; color: var(--color-ink-sub); background: transparent; border-color: transparent; }
.tabs > button[aria-selected="true"], .tabs > button[aria-pressed="true"], .tabs > button.is-active { background: var(--color-surface); color: var(--color-accent-tint-ink); box-shadow: var(--shadow-card); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips > button, button.chip { border: 1px solid transparent; border-radius: 999px; background: var(--color-surface-tag); color: var(--color-accent-tint-ink); padding: 6px 14px; font: inherit; cursor: pointer; }
.chips > button[aria-pressed="true"], .chips > button.is-active, button.chip[aria-pressed="true"] { background: linear-gradient(92deg, var(--color-brand-grad-from), var(--color-brand-grad-to)); color: #fff; box-shadow: 0 6px 16px rgba(32,104,240,.28); }
/* 首页 hero 模块已移除（用户要求），相关 .hero* 规则一并删除 */
/* 生成方式：竖向轨道（左侧导轨），替代原「tabs + 重复的 quick 卡片」两套按钮 */
.mode-rail { display: flex; flex-direction: column; gap: 8px; padding: 8px; border-radius: var(--radius-xl); background: var(--color-surface-alt); border: 1px solid var(--color-border); align-self: start; }
.mode-rail > button { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 14px 8px; border: 1px solid transparent; border-radius: var(--radius-md); background: transparent; color: var(--color-ink-sub); font: inherit; font-weight: 600; cursor: pointer; transition: background var(--dur-fast), color var(--dur-fast), box-shadow var(--dur-fast); }
.mode-rail > button:hover { color: var(--color-ink); }
.mode-rail > button[aria-selected="true"] { background: var(--color-surface); color: var(--color-accent-tint-ink); box-shadow: var(--shadow-card); }
.mode-rail-icon { display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: var(--radius-md); background: var(--color-surface-tag); color: var(--color-accent-tint-ink); }
.mode-rail > button[aria-selected="true"] .mode-rail-icon { background: linear-gradient(92deg, var(--color-brand-grad-from), var(--color-brand-grad-to)); color: #fff; }
.provider-trigger { border-radius: 999px; background: var(--color-surface-band); border-color: var(--color-border); height: auto; min-height: 32px; flex-wrap: wrap; padding: 4px 12px; }
.provider-trigger .status { display: inline-flex; align-items: center; gap: 6px; background: transparent; }
.provider-trigger .status::before { content: ""; width: 6px; height: 6px; flex: none; border-radius: 50%; background: currentColor; }
.brand-mark { background: linear-gradient(92deg, var(--color-brand-grad-from), var(--color-brand-grad-to)); box-shadow: 0 4px 12px rgba(32,104,240,.28); }
.metric-value { font-size: 26px; }
[data-theme="dark"] .mode-rail { background: var(--color-surface-alt); border-color: var(--color-border-strong); }
@media (max-width: 640px) { .mode-rail { flex-direction: row; } .mode-rail > button { flex: 1 1 0; } .band { padding: 16px; } }
button.chip:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
button.chip:disabled { opacity: .5; cursor: not-allowed; }
@media (prefers-reduced-motion: reduce) { .card-interactive:hover, .thumb:hover { transform: none; } }


/* —— 应用外壳（本文件特有；组件样式全部来自 ui-design/app.css 令牌） —— */
.app { display: flex; min-height: 100vh; }
.side { width: 236px; flex: 0 0 236px; background: var(--color-surface); border-right: 1px solid var(--color-border); padding: 20px 16px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; }
.brand { font-weight: 600; font-size: 18px; letter-spacing: .2px; }
.side nav { display: flex; flex-direction: column; gap: 4px; }
.side nav a { display: block; padding: 8px 10px; border-radius: var(--radius-sm); color: var(--color-ink); text-decoration: none; font-size: var(--text-body-sm); }
.side nav a:hover { background: var(--color-surface-alt); }
.side nav a.on { background: var(--color-surface-tag); color: var(--color-accent-tint-ink); font-weight: 500; }
.side-foot { margin-top: auto; border-top: 1px solid var(--color-divider); padding-top: 12px; }
.main { flex: 1; padding: 24px 28px 80px; max-width: 1240px; }
.topbar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--color-neutral) 92%, transparent); backdrop-filter: blur(8px); padding-bottom: 12px; margin-bottom: 4px; }
h1.page { font-size: var(--text-h1); margin: 0 0 4px; }
.page-sub { color: var(--color-ink-sub); margin: 0 0 16px; }
.cols-3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.hint { color: var(--color-ink-sub); font-size: var(--text-body-sm); }
.sw-mini { display: inline-block; width: 20px; height: 20px; border-radius: 5px; border: 1px solid var(--color-border); }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.sw { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 6px; }
.sw-chip { height: 34px; border-radius: 4px; border: 1px solid var(--color-border); }
.sw-name { font-size: var(--text-caption); margin-top: 4px; }
.sw-hex { font-size: var(--text-caption); color: var(--color-ink-sub); }
.card.pack { cursor: pointer; }
.card.pack.sel { border-color: var(--color-accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-accent) 16%, transparent); }
.toolbar-note { font-size: var(--text-caption); color: var(--color-ink-sub); }
code { background: var(--color-surface-alt); padding: 1px 5px; border-radius: 4px; font-family: var(--font-mono); font-size: .92em; }
</style>

/* ============================ 内容梳理（与后端 local_split 同规则） ============================ */
const LAYOUT_CYCLE = ['cover', 'cards_4', 'data_chart', 'comparison_2col', 'timeline', 'cards_4', 'summary'];
function localSplit(text, target) {
  const blocks = []; let cur = [];
  String(text || '').split(/\r?\n/).forEach(line => {
    const s = line.trim();
    if (!s) { if (cur.length) { blocks.push(cur); cur = []; } return; }
    const isHead = /^(#{1,4}\s|第[一二三四五六七八九十]+[章节部分]|[一二三四五六七八九十]+、|\d+(\.\d+)*\s)/.test(s);
    if (isHead && cur.length) { blocks.push(cur); cur = [s]; } else cur.push(s);
  });
  if (cur.length) blocks.push(cur);
  if (!blocks.length) blocks = [[String(text || '')]];
  let pages = blocks.map((blk, i) => {
    const head = blk[0].replace(/^#+\s*/, '').slice(0, 18);
    const pts = blk.slice(1, 5).map(x => x.replace(/^[-*·\d.]+\s*/, '').slice(0, 40));
    const mk = (blk.join(' ').match(/\d+(?:\.\d+)?%?|[A-Z]{2,}/g) || []).slice(0, 6);
    return { pageNo: i + 1, title: head || ('第 ' + (i + 1) + ' 页'), role: i === 0 ? 'cover' : 'content',
             outline: (blk[1] || head).slice(0, 60), points: pts.length ? pts : [head], mustKeep: Array.from(new Set(mk)),
             layout: i === 0 ? 'cover' : LAYOUT_CYCLE[i % LAYOUT_CYCLE.length] };
  });
  if (target && pages.length > target) pages = pages.slice(0, target);
  pages.forEach((p, i) => {
    p.pageNo = i + 1;
    if (i === 0) { p.layout = 'cover'; p.role = 'cover'; }
    else if (i === pages.length - 1) { p.layout = 'summary'; p.role = 'summary'; }
    else p.role = p.role || 'content';
  });
  return pages;
}

/* ============================ Canvas 页面渲染（与 Python local_render 同逻辑） ============================ */
const SIZE_PX = { '1K': [1024, 576], '2K': [2048, 1152], '4K': [4096, 2304] };
function hex(c, d) { c = (c || d || '#FFFFFF').replace('#', ''); return '#' + (c.length === 6 ? c : 'FFFFFF'); }
function wrapText(ctx, text, maxW) {
  const out = []; let line = '';
  for (const ch of String(text || '')) {
    if (ch === '\n') { out.push(line); line = ''; continue; }
    if (ctx.measureText(line + ch).width <= maxW) line += ch;
    else { out.push(line); line = ch; }
  }
  if (line) out.push(line);
  return out;
}
function renderPageCanvas(slide, pack, size, pageNo, total, projectTitle) {
  const [W, H] = SIZE_PX[size] || SIZE_PX['2K'];
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const c = pack.colors || {};
  const bg = hex(c.bg || c.neutral, '#FFFFFF'), surface = hex(c.surface, '#F6F7F9');
  const accent = hex(c.accent || c.primary, '#1E78FA'), accent2 = hex(c['accent-2'] || c.tertiary, '#26ABFE');
  const ink = hex(c.ink, '#1E232E'), inkSub = hex(c['ink-sub'] || c.secondary, '#666666');
  const s = W / 2048, px = v => Math.max(1, Math.round(v * s));
  const F = (sz, w) => (w || 400) + ' ' + px(sz) + 'px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = accent; ctx.fillRect(0, 0, W, px(10));
  const M = px(120);
  const layout = slide.layout || 'cards_4', title = slide.title || '', points = slide.points || [];
  let y = M;
  if (layout === 'cover') {
    y = px(300);
    ctx.fillStyle = accent; ctx.fillRect(M, y, px(8), px(260));
    ctx.fillStyle = ink; ctx.font = F(74, 600);
    wrapText(ctx, title, W - 2 * M - px(40)).slice(0, 3).forEach(l => { ctx.fillText(l, M + px(36), y + px(60)); y += px(96); });
    ctx.fillStyle = inkSub; ctx.font = F(48, 400); y += px(24);
    wrapText(ctx, slide.outline || '', W * 0.7).slice(0, 3).forEach(l => { ctx.fillText(l, M + px(36), y + px(40)); y += px(64); });
  } else {
    ctx.fillStyle = ink; ctx.font = F(74, 600);
    wrapText(ctx, title, W - 2 * M).slice(0, 2).forEach(l => { ctx.fillText(l, M, y + px(60)); y += px(92); });
    y += px(30); ctx.fillStyle = accent; ctx.fillRect(M, y, px(120), px(6)); y += px(50);
    const areaTop = y, areaH = H - areaTop - px(110);
    ctx.font = F(38, 400);
    if (layout === 'cards_4' && points.length) {
      const n = Math.min(4, points.length), gap = px(28), cw = Math.floor((W - 2 * M - gap * (n - 1)) / n);
      for (let i = 0; i < n; i++) {
        const x0 = M + i * (cw + gap);
        ctx.fillStyle = surface; ctx.fillRect(x0, areaTop, cw, areaH);
        ctx.fillStyle = i % 2 ? accent2 : accent; ctx.fillRect(x0, areaTop, cw, px(10));
        ctx.fillStyle = ink; ctx.font = F(38, 400);
        let ty = areaTop + px(40) + px(44);
        wrapText(ctx, points[i], cw - px(48)).slice(0, 10).forEach(l => { ctx.fillText(l, x0 + px(24), ty); ty += px(56); });
      }
    } else if (layout === 'comparison_2col' && points.length >= 2) {
      const half = Math.ceil(points.length / 2), cols = [points.slice(0, half), points.slice(half)], gap = px(40);
      const cw = Math.floor((W - 2 * M - gap) / 2);
      cols.forEach((items, ci) => {
        const x0 = M + ci * (cw + gap);
        ctx.fillStyle = surface; ctx.fillRect(x0, areaTop, cw, areaH);
        ctx.fillStyle = ci ? accent2 : accent; ctx.fillRect(x0, areaTop, cw, px(12));
        ctx.fillStyle = ink; ctx.font = F(38, 400);
        let ty = areaTop + px(50) + px(44);
        items.forEach(it => { wrapText(ctx, '· ' + it, cw - px(56)).slice(0, 4).forEach(l => { ctx.fillText(l, x0 + px(28), ty); ty += px(54); }); ty += px(12); });
      });
    } else if (layout === 'data_chart' && points.length) {
      const leftW = Math.floor(W * 0.42);
      ctx.fillStyle = ink; ctx.font = F(38, 400);
      let ty = areaTop + px(44);
      points.slice(0, 6).forEach(it => { wrapText(ctx, '· ' + it, leftW - M).slice(0, 3).forEach(l => { ctx.fillText(l, M, ty); ty += px(52); }); ty += px(10); });
      const nums = points.slice(0, 6).map(it => { const m = String(it).match(/(\d+(?:\.\d+)?)/); return m ? parseFloat(m[1]) : 0; });
      if (nums.some(v => v > 0)) {
        const mx = Math.max.apply(null, nums) || 1, cx0 = M + leftW, cw = W - M - cx0;
        const bw = Math.floor((cw - px(20) * (nums.length - 1)) / Math.max(1, nums.length));
        nums.forEach((v, i) => {
          const h = Math.round(areaH * 0.85 * (v / mx)), x0 = cx0 + i * (bw + px(20));
          ctx.fillStyle = i % 2 ? accent2 : accent;
          ctx.fillRect(x0, areaTop + areaH - h, bw, h);
          ctx.fillStyle = ink; ctx.font = F(28, 500);
          ctx.fillText(String(v), x0 + px(6), areaTop + areaH - h - px(16));
          ctx.font = F(38, 400);
        });
      }
    } else if (layout === 'timeline' && points.length) {
      const n = Math.min(5, points.length), axisY = areaTop + px(80);
      ctx.fillStyle = accent2; ctx.fillRect(M + px(20), axisY, W - 2 * M - px(40), px(6));
      const seg = n > 1 ? Math.floor((W - 2 * M - px(40)) / (n - 1)) : 0;
      ctx.font = F(38, 400);
      for (let i = 0; i < n; i++) {
        const x0 = M + px(20) + i * seg;
        ctx.fillStyle = accent; ctx.beginPath(); ctx.arc(x0, axisY + px(3), px(16), 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = ink;
        let ty = axisY + px(50) + px(44);
        wrapText(ctx, points[i], seg ? Math.floor(seg * 0.92) : px(400)).slice(0, 6).forEach(l => { ctx.fillText(l, x0 - px(10), ty); ty += px(54); });
      }
    } else {
      const items = points.length ? points.slice(0, 4) : [title];
      ctx.font = F(48, 600);
      let ty = areaTop + px(56);
      items.forEach((it, i) => {

    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, len, true); lh.setUint32(22, len, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    chunks.push(new Uint8Array(lh.buffer), name, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true); ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, len, true); ch.setUint32(24, len, true); ch.setUint16(28, name.length, true);
    ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);

  eocd.setUint32(0, 0x06054b50, true); eocd.setUint16(8, files.length, true); eocd.setUint16(10, files.length, true);
  eocd.setUint32(12, cdSize, true); eocd.setUint32(16, offset, true);

function setStep(n) { state.wizard.step = n; render(); }
function currentPack() { return PACKS.find(p => p.id === state.wizard.packId) || PACKS[0]; }
async function step1Next() {
  const w = state.wizard;
  w.draft.title = ($('#pjTitle') || {}).value || w.draft.title;
  w.draft.text = ($('#txSource') || {}).value || '';
  w.draft.target = parseInt(($('#pjTarget') || {}).value || '10', 10) || 10;
  if (!w.draft.text.trim()) { alert('请先粘贴或载入内容'); return; }
  w.pages = localSplit(w.draft.text, w.draft.target);
  logUsage('parse', 'local', 'rule', '-', 0, 0, true, w.draft.text.length + ' 字 → ' + w.pages.length + ' 页');
  setStep(2);
}
async function step3Outline() {
  const w = state.wizard;
  $('#olNote') && ($('#olNote').textContent = '梳理中…');
  const keep = w.pages.filter(p => p.keep !== false);
  if (w.backendOn) {
    const r = await BACKEND.outline(keep.map(p => p.title + '\n' + (p.points || []).join('\n')).join('\n\n'), keep.length);
    if (r) { w.pages = r.pages.map(p => Object.assign(p, { keep: true })); w.olNote = '✅ 已通过本地后端梳理（' + r.note + '）；你可继续微调版式。'; logUsage('outline', 'deepseek', 'via-backend', '-', 0, 0, true, '后端梳理 ' + r.pages.length + ' 页'); }
    else { w.olNote = '后端不可用，已回落本地规则切页。'; }
  }
  setStep(3);
}
async function step4Generate() {
  const w = state.wizard;
  const pack = currentPack();
  const size = ($('#genSize') || {}).value || '2K';
  const pages = w.pages.filter(p => p.keep !== false);
  setStep(5);
  const grid = $('#thumbGrid'), bar = $('#genBar'), msg = $('#genMsg');
  const blobs = [];
  const t0 = performance.now();
  for (let i = 0; i < pages.length; i++) {
    const p = pages[i];
    msg.textContent = '正在生成第 ' + (i + 1) + '/' + pages.length + ' 页 · ' + p.title;
    let cv = null, provider = 'local_render', model = 'canvas', cny = 0;
    if (w.backendOn) {
      const r = await BACKEND.image(p, pack, p.layout, pages.length, w.draft.title);
      if (r && r.bitmap) {
        cv = document.createElement('canvas'); cv.width = r.bitmap.width; cv.height = r.bitmap.height;
        cv.getContext('2d').drawImage(r.bitmap, 0, 0);
        provider = r.provider; model = r.model; cny = r.cny || 0;
      }
    }
    if (!cv) cv = renderPageCanvas(p, pack, size, i + 1, pages.length, w.draft.title);
    const bytes = await canvasToBytes(cv);
    blobs.push(bytes);
    const url = URL.createObjectURL(new Blob([bytes], { type: 'image/png' }));
    const cell = document.createElement('div');
    cell.className = 'thumb ' + (w.selected.has(p.pageNo) ? 'selected' : '');
    cell.style.aspectRatio = 'auto';
    cell.innerHTML = '<img src="' + url + '" style="width:100%;display:block;border-radius:var(--radius-md)">' +
      '<span class="corner tag num">' + (i + 1) + '</span><span class="corner status status-info" style="left:auto;right:6px">' + esc(provider) + '</span>';
    cell.title = p.title;
    grid.appendChild(cell);
    bar.style.width = Math.round((i + 1) / pages.length * 100) + '%';
    logUsage('generate', provider, model, size, cny, 0, true, 'P' + (i + 1) + ' ' + p.layout);
  }
  const ms = Math.round(performance.now() - t0);
  w.slides = pages.map((p, i) => ({ pageNo: i + 1, title: p.title, outline: p.outline, points: p.points, layout: p.layout, blob: blobs[i], provider: 'local_render', size }));
  w.genNote = '✅ ' + pages.length + ' 页完成，用时 ' + (ms / 1000).toFixed(1) + 's（' + (w.backendOn ? '后端/本地混合' : '本地 Canvas 渲染') + '）';
  msg.textContent = w.genNote;
  persistCurrent(blobs);
}
function persistCurrent(blobs) {
  const w = state.wizard;
  const pid = w.pid || uid('p');
  w.pid = pid;
  const rec = { id: pid, title: w.draft.title, createdAt: nowISO(), packId: w.packId, size: w.size || '2K',
                pages: w.pages.filter(p => p.keep !== false), slides: (w.slides || []).map(s => ({ pageNo: s.pageNo, title: s.title, layout: s.layout, points: s.points, outline: s.outline })) };
  const i = state.projects.findIndex(p => p.id === pid);
  if (i >= 0) state.projects[i] = rec; else state.projects.unshift(rec);
  save();
}
function renderEditGrid() {
  const w = state.wizard, grid = $('#editGrid');
  if (!grid) return;
  grid.innerHTML = (w.slides || []).map(s => {

async function exportPptx(kind) {
  const w = state.wizard;
  if (!w.slides || !w.slides.length) { alert('请先生成页面'); return; }
  const editableSet = kind === 'editable' ? w.selected : new Set();
  const u8 = buildPptx(w.slides.map(s => ({ title: s.title, outline: s.outline, points: s.points, layout: s.layout })),
                       w.slides.map(s => s.blob), editableSet);
  const name = (w.draft.title || 'deck') + (kind === 'editable' ? '_可编辑版' : '_图片版') + '.pptx';
  download(name, u8);
  window.__lastPptx = { name, size: u8.length, kind, pages: w.slides.length, editable: Array.from(editableSet), b64: btoa(String.fromCharCode.apply(null, u8.slice(0, 1))) };
  // 供自动化验证：把完整字节暴露为 base64
  let s = ''; const CH = 0x8000;
  for (let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
  window.__lastPptxB64 = btoa(s);
  window.__lastPptxMeta = { name, kind, pages: w.slides.length, editable: Array.from(editableSet), sizeBytes: u8.length };
  logUsage(kind === 'editable' ? 'export_editable' : 'export_image', 'local_js', 'ooxml-writer', '-', 0, 0, true, name);
  if (kind === 'editable' && w.selected.size === 0) alert('当前未勾选任何页，导出的都是「图片直通」页（可在缩略图上点选要转可编辑的页）。');
}

      $('#pjTarget').value = target || 6;
      await step1Next();
      setStep(3); await step3Outline();
      setStep(4); state.wizard.packId = 'biz-bluegold'; state.wizard.size = ($('#genSize') || {}).value || '2K';
      setStep(5); await step4Generate();
      setStep(6); renderEditGrid();
      return { pages: state.wizard.slides.length, step: state.wizard.step, title: state.wizard.draft.title };
    },
  };
});

</script>
